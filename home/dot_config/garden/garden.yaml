garden:
  root: ~/projects
  includes: [commands.yaml]
groups:
  projects:
    - beforerr
    - Apartar
    - share
    - travel
    - cs_theory
    - energetic_particles
    - ion_scattering_by_SWD
    - psp_conjunction
    - CurrentSheetTestParticle
    - dmsp_elfin
    - SPEDAS_paper
    - AKR
  julia:
    - ~/src/julia-client
    - ~/src/TestParticle.jl
    - ~/src/JuliaPlasma/PlasmaFormulary.jl
    - ~/src/TimeseriesUtilities.jl
  julia-dev:
    - ~/.julia/dev/*
  src:
    - ~/src/beforerr_dev
    - ~/src/space-analysis.py
    - ~/src/workflows
    - ~/src/Beforerr.m
    - /opt/homebrew/Library/Taps/beforerr/homebrew-beforerr
trees:
  beforerr:
    url: "https://github.com/Beforerr/beforerr.git"
  Apartar:
    url: "https://github.com/Beforerr/Apartar.git"
  share:
    url: "https://github.com/Beforerr/project-share.git"
  travel:
    url: "https://github.com/Beforerr/travel"
  cs_theory:
    url: "https://github.com/Beforerr/cs_theory.git"
  energetic_particles:
    url: "https://github.com/Beforerr/energetic_particles.git"
  ion_scattering_by_SWD:
    url: "https://github.com/Beforerr/ion_scattering_by_SWD.git"
  psp_conjunction:
    url: "https://github.com/Beforerr/psp_conjunction.git"
  dmsp_elfin:
    url: "https://github.com/Beforerr/dmsp_elfin.git"
  SPEDAS_paper:
    url: https://github.com/Beforerr/SPEDAS_paper
  CurrentSheetTestParticle:
    url: "https://github.com/Beforerr/CurrentSheetTestParticle.git"
  AKR:
    url: "https://github.com/Beforerr/AKR"
  ~/src/workflows:
    url: "https://github.com/Beforerr/workflows.git"
  ~/src/Beforerr.m:
    url: "https://github.com/Beforerr/Beforerr.m.git"
  ~/src/beforerr_dev:
    url: "https://github.com/Beforerr/beforerr_dev.git"
  ~/src/space-analysis.py:
    url: "https://github.com/Beforerr/space-analysis.py"
  ~/.julia/dev/Discontinuity:
    url: "https://github.com/Beforerr/Discontinuity.jl"
  ~/.julia/dev/beforerr:
    url: "https://github.com/Beforerr/beforerr.jl"
  ~/.julia/dev/ChargedParticles:
    url: "https://github.com/JuliaPlasma/ChargedParticles.jl"
  ~/.julia/dev/PermuteArgs:
    url: "https://github.com/Beforerr/PermuteArgs.jl"
  ~/src/julia-client:
    url: https://github.com/Beforerr/julia-client
  /opt/homebrew/Library/Taps/beforerr/homebrew-beforerr:
    url: "https://github.com/Beforerr/homebrew-beforerr"
  ~/src/TestParticle.jl:
    url: "https://github.com/henry2004y/TestParticle.jl"
  ~/src/TimeseriesUtilities.jl:
    url: "https://github.com/Beforerr/TimeseriesUtilities.jl"
  ~/src/JuliaPlasma/PlasmaFormulary.jl:
    url: "https://github.com/JuliaPlasma/PlasmaFormulary.jl"
  ~/.julia/dev/TimeseriesUtilities: {symlink: ~/src/TimeseriesUtilities.jl}
  ~/.julia/dev/PlasmaFormulary: {symlink: ~/src/JuliaPlasma/PlasmaFormulary.jl}
