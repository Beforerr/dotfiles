garden:
  root: ~/projects
commands:
  pull:
    - "[ -d .jj ] && jj git fetch --quiet || git pull --quiet"
    - git submodule update --init --recursive
  status:
    - "[ -d .jj ] && (jj st | grep -E '^(Working copy changes:|Parent commit changes:)' || true) || git status -s"
groups:
  projects:
    - beforerr
    - Apartar
    - share
    - travel
    - cs_theory
    - energetic_particles
    - ion_scattering_by_SWD
    - psp_conjunction
    - CurrentSheetTestParticle
    - dmsp_elfin
    - SPEDAS_paper
    - AKR
  julia:
    - ~/src/julia-client
    - ~/src/HAPIClient.jl
    - ~/src/TestParticle.jl
    - ~/src/Speasy.jl
    - ~/src/IRBEM.jl
    - ~/src/TsyganenkoModels.jl
    - ~/src/PlanetaryMagneticFields.jl
    - ~/src/GeoAACGM.jl
    - ~/src/GeoCotrans.jl
    - ~/src/Madrigal.jl
    - ~/src/PlasmaWaves.jl
    - ~/src/PlasmaBO.jl
    - ~/src/PlasmaFormulary.jl
    - ~/src/juliaspacephysics.github.io
    - ~/src/juliaspacephysics-actions
    - ~/src/TimeseriesUtilities.jl
    - ~/src/SpaceDataModel.jl
    - ~/src/SpacePhysicsMakie.jl
    - ~/src/SPEDAS.jl
    - ~/src/PySPEDAS.jl
    - ~/src/SolarEnergeticParticle.jl
    - ~/src/MinimumVarianceAnalysis.jl
    - ~/src/MultiSpacecraftAnalysis.jl
    - ~/src/CommonDataFormat.jl
    - ~/src/CDFDatasets.jl
    - ~/src/CDAWeb.jl
    - ~/src/ELFINData.jl
    - ~/src/ERGData.jl
    - ~/src/DMSPData.jl
    - ~/src/VelocityDistributionFunctions.jl
    - ~/src/SpaceWeather.jl
  # clones + symlinks to ~/src/*.jl, so Pkg.develop("Name") resolves them
  julia-dev:
    - ~/.julia/dev/*
  src:
    - ~/src/beforerr_dev
    - ~/src/space-analysis.py
    - ~/src/workflows
    - ~/src/Beforerr.m
    - /opt/homebrew/Library/Taps/beforerr/homebrew-beforerr
trees:
  beforerr:
    url: "https://github.com/Beforerr/beforerr.git"
  Apartar:
    url: "https://github.com/Beforerr/Apartar.git"
