# Separate garden because an included file's garden.root is ignored.
garden:
  root: ~/src/JuliaSpacePhysics
  includes: [commands.yaml]
commands:
  jj-init: "[ -d .jj ] || (jj git init --colocate && jj bookmark track main --remote origin)"
templates:
  jsp:
    url: "https://github.com/JuliaSpacePhysics/${TREE_NAME}"
trees:
  actions: {templates: jsp}
  juliaspacephysics.github.io: {templates: jsp}
  CDAWeb.jl: {templates: jsp}
  CDFDatasets.jl: {templates: jsp}
  CommonDataFormat.jl: {templates: jsp}
  DMSPData.jl: {templates: jsp}
  EISCATData.jl: {templates: jsp}
  ELFINData.jl: {templates: jsp}
  ERGData.jl: {templates: jsp}
  GeoAACGM.jl: {templates: jsp}
  GeoCotrans.jl: {templates: jsp}
  HAPIClient.jl: {templates: jsp}
  IRBEM.jl: {templates: jsp}
  Madrigal.jl: {templates: jsp}
  MinimumVarianceAnalysis.jl: {templates: jsp}
  MultiSpacecraftAnalysis.jl: {templates: jsp}
  PlanetaryMagneticFields.jl: {templates: jsp}
  PlasmaBO.jl: {templates: jsp}
  PlasmaWaves.jl: {templates: jsp}
  PySPEDAS.jl: {templates: jsp}
  SolarEnergeticParticle.jl: {templates: jsp}
  SpaceDataModel.jl: {templates: jsp}
  SpacePhysicsMakie.jl: {templates: jsp}
  SpaceWeather.jl: {templates: jsp}
  Speasy.jl: {url: "https://github.com/SciQLop/Speasy.jl"}
  SSCWeb.jl: {templates: jsp}
  SPEDAS.jl: {templates: jsp}
  TRACERSData.jl: {templates: jsp}
  TsyganenkoModels.jl: {templates: jsp}
  VelocityDistributionFunctions.jl: {templates: jsp}
  VlasovMaxwellDispersion.jl: {templates: jsp}
  ~/.julia/dev/CDAWeb: {symlink: CDAWeb.jl}
  ~/.julia/dev/CDFDatasets: {symlink: CDFDatasets.jl}
  ~/.julia/dev/CommonDataFormat: {symlink: CommonDataFormat.jl}
  ~/.julia/dev/DMSPData: {symlink: DMSPData.jl}
  ~/.julia/dev/EISCATData: {symlink: EISCATData.jl}
  ~/.julia/dev/ELFINData: {symlink: ELFINData.jl}
  ~/.julia/dev/ERGData: {symlink: ERGData.jl}
  ~/.julia/dev/GeoAACGM: {symlink: GeoAACGM.jl}
  ~/.julia/dev/GeoCotrans: {symlink: GeoCotrans.jl}
  ~/.julia/dev/HAPIClient: {symlink: HAPIClient.jl}
  ~/.julia/dev/IRBEM: {symlink: IRBEM.jl}
  ~/.julia/dev/Madrigal: {symlink: Madrigal.jl}
  ~/.julia/dev/MinimumVarianceAnalysis: {symlink: MinimumVarianceAnalysis.jl}
  ~/.julia/dev/MultiSpacecraftAnalysis: {symlink: MultiSpacecraftAnalysis.jl}
  ~/.julia/dev/PlanetaryMagneticFields: {symlink: PlanetaryMagneticFields.jl}
  ~/.julia/dev/PlasmaBO: {symlink: PlasmaBO.jl}
  ~/.julia/dev/PlasmaWaves: {symlink: PlasmaWaves.jl}
  ~/.julia/dev/PySPEDAS: {symlink: PySPEDAS.jl}
  ~/.julia/dev/SolarEnergeticParticle: {symlink: SolarEnergeticParticle.jl}
  ~/.julia/dev/SpaceDataModel: {symlink: SpaceDataModel.jl}
  ~/.julia/dev/SpacePhysicsMakie: {symlink: SpacePhysicsMakie.jl}
